civilian:
  name: Гражданский
  description: Днём обсуждает события и голосует против подозреваемых.
mafia_boss:
  name: Глава мафии
  description: Руководит коллективным ночным убийством мафии.
mafia:
  name: Мафия
  description: Голосует за ночную жертву и наследует руководство после смерти главы.
commissioner:
  name: Комиссар
  description: Ночью проверяет роль игрока или совершает выстрел.
warrant_officer:
  name: Прапорщик
  description: Получает проверки Комиссара и занимает его место после гибели.
doctor:
  name: Дохтор
  description: Лечит выбранного игрока; один раз за игру может вылечить себя.
maniac:
  name: Маньяк
  description: Каждую ночь убивает одного игрока и побеждает в одиночку.
snow_white:
  name: Белоснежка
  description: Блокирует действие цели ночью и её активность следующим днём.
lawyer:
  name: Адвокат
  description: Автоматически скрывает случайного подопечного от проверки Комиссара.
suicide:
  name: Самоубийца
  description: Побеждает, если его казнят на дневном голосовании.
homeless:
  name: Бомж
  description: Наблюдает за целью и видит её ночных посетителей.
lucky:
  name: Счастливчик
  description: Имеет шанс пережить ночное покушение.
best_friend:
  name: Лучший друг
  description: После собственной дневной казни забирает с собой выбранного игрока.
