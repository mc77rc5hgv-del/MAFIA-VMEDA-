[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mafia-vmeda"
version = "0.4.0"
description = "Telegram Mafia game bot themed for VMEDA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4.0",
  "aiosqlite>=0.20,<1.0",
  "asyncpg>=0.30,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
  "redis>=5.2,<7.0",
  "SQLAlchemy[asyncio]>=2.0.36,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
mafia-vmeda = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
